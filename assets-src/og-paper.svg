<?xml version="1.0" encoding="UTF-8"?>
<!--
  Social preview card, 1200×630 (spec §13: OG image comes from the paper theme).

  Authored as SVG and rasterized locally with `qlmanage` (see
  scripts/make-og.sh) because there is no browser in this environment to
  screenshot the real paper route with, and font CDNs are blocked.

  Deliberately conservative SVG: no mix-blend-mode, no feTurbulence, no external
  fonts. macOS QuickLook's SVG support is partial, and an OG image that fails to
  rasterize is worse than a plain one. The riso overprint effect is approximated
  with layered translucent fills, which is what riso actually is.

  Regenerate with: bash scripts/make-og.sh
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Halftone dot field — riso's signature texture, a few hundred bytes. -->
    <pattern id="halftone" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" fill="#c2543f" opacity="0.16" />
    </pattern>
    <pattern id="halftoneFine" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.8" fill="#4a6b57" opacity="0.13" />
    </pattern>
  </defs>

  <!-- Warm off-white stock -->
  <rect width="1200" height="630" fill="#f7f2e8" />

  <!-- Spot-colour blocks. Overlaps read as overprint because both are translucent. -->
  <circle cx="1010" cy="120" r="200" fill="#a8c3ae" opacity="0.5" />
  <circle cx="1120" cy="250" r="150" fill="#e8b4b8" opacity="0.45" />
  <circle cx="120" cy="560" r="170" fill="#f0d59a" opacity="0.5" />
  <circle cx="60" cy="470" r="90" fill="#a9c4d6" opacity="0.42" />

  <!-- Halftone over the whole sheet, then a finer pass bottom-left -->
  <rect width="1200" height="630" fill="url(#halftone)" />
  <rect x="0" y="300" width="520" height="330" fill="url(#halftoneFine)" />

  <!-- Index card, tilted 1.5° like everything else on the corkboard -->
  <g transform="rotate(-1.5 600 315)">
    <rect x="88" y="132" width="1024" height="366" fill="#fffdf7" opacity="0.94" />
    <!-- 1px channel misregistration: the same edge printed twice, slightly off -->
    <rect
      x="86.5"
      y="130.5"
      width="1024"
      height="366"
      fill="none"
      stroke="#c2543f"
      stroke-width="1.5"
      opacity="0.34"
    />
    <rect
      x="88"
      y="132"
      width="1024"
      height="366"
      fill="none"
      stroke="#3d3a34"
      stroke-width="1.5"
      opacity="0.5"
    />

    <!-- Washi tape, top-left corner -->
    <g transform="rotate(-24 150 140)">
      <rect x="86" y="122" width="132" height="34" fill="#a8c3ae" opacity="0.72" />
      <rect x="86" y="122" width="132" height="34" fill="url(#halftone)" />
    </g>

    <text
      x="140"
      y="252"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="92"
      font-weight="bold"
      fill="#26241f"
      letter-spacing="-1"
    >
      Dylan Nagel
    </text>

    <text
      x="144"
      y="308"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="35"
      fill="#4a4640"
    >
      Full-Stack Developer · AI &amp; LLM Systems
    </text>

    <!-- Highlighter swipe under the availability line, as on the real hero -->
    <rect x="138" y="352" width="606" height="46" fill="#f0d59a" opacity="0.82" />
    <rect x="138" y="352" width="606" height="46" fill="url(#halftone)" />
    <text
      x="150"
      y="386"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="31"
      font-weight="bold"
      fill="#2c2a25"
    >
      Seeking a Summer 2027 co-op
    </text>

    <text
      x="142"
      y="452"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="25"
      fill="#5c574f"
    >
      Computer Science · University of Waterloo
    </text>
  </g>

  <!-- Push pin, top centre — it's a corkboard -->
  <g transform="translate(600 118)">
    <ellipse cx="2" cy="16" rx="9" ry="4" fill="#26241f" opacity="0.22" />
    <circle cx="0" cy="0" r="15" fill="#c2543f" />
    <circle cx="-5" cy="-5" r="5" fill="#e8867a" opacity="0.85" />
    <circle cx="0" cy="0" r="15" fill="none" stroke="#8e3526" stroke-width="1.5" opacity="0.6" />
  </g>
</svg>
